name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 系统交互代码（Get-NetAdapter/UAC/displaydns）仅 Windows 可测
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 首次构建 tauri + hickory 约 10 分钟，缓存后 2 分钟内
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run tests
        working-directory: src-tauri
        run: cargo test
